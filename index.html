<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AFTERIMAGE</title>
    <meta name="description" content="An observatory festival whose programme becomes a personal light composition" />
    <style>
      /* Arrival veil: shown until worldReady() in src/loader.ts lifts it. A lens iris over ink. */
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 22px; background: radial-gradient(circle at 50% 45%, #141824 0%, #07080c 60%); color: #f1ece0; font: 900 clamp(28px, 7vw, 64px)/0.9 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.02em; transition: opacity 0.7s ease, visibility 0.7s; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival .word { text-shadow: -4px 0 rgba(255, 51, 85, 0.45), 4px 0 rgba(51, 119, 255, 0.45); animation: arrival-resolve 2.4s ease-in-out infinite alternate; }
      #arrival .iris { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #d8b46a; box-shadow: 0 0 40px rgba(143, 216, 255, 0.35), inset 0 0 18px rgba(143, 216, 255, 0.4); animation: arrival-iris 1.6s ease-in-out infinite alternate; }
      #arrival small { font: 700 11px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: #a39f95; }
      @keyframes arrival-resolve { to { text-shadow: 0 0 rgba(255, 51, 85, 0), 0 0 rgba(51, 119, 255, 0); } }
      @keyframes arrival-iris { from { transform: scale(0.7); opacity: 0.6; } to { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #arrival .word, #arrival .iris { animation: none; } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite"><div class="iris" aria-hidden="true"></div><span class="word">AFTERIMAGE</span><small>Focusing the lens</small></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
